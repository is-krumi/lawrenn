name: Deploy Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy send-notification --no-verify-jwt
          supabase functions deploy handle-inbound-call --no-verify-jwt
          supabase functions deploy check-availability --no-verify-jwt
          supabase functions deploy process-call-transcript --no-verify-jwt
          supabase functions deploy run-followup-sequences
          supabase functions deploy send-review-request
          supabase functions deploy stripe-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: iwocaqhwobuydhfmghyo